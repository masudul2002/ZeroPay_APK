name: Android CI Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Test APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Ensure Gradle Wrapper & Permissions
      run: |
        echo "=== Locating and preparing gradlew ==="
        if [ ! -f "./gradlew" ]; then
          echo "gradlew not found in root, searching in subdirectories..."
          SUB_GRADLEW=$(find . -maxdepth 3 -name "gradlew" | head -n 1)
          if [ -n "$SUB_GRADLEW" ]; then
            echo "Found gradlew at $SUB_GRADLEW, copying to root..."
            cp "$SUB_GRADLEW" ./gradlew
          else
            echo "Generating Gradle wrapper..."
            gradle wrapper
          fi
        fi
        
        # Grant executable permissions
        chmod +x ./gradlew
        ls -la ./gradlew
        ./gradlew --version

    - name: Generate debug keystore
      run: keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "C=US, O=Android, CN=Android Debug"

    - name: Build Debug APK
      run: ./gradlew assembleDebug -Djava.awt.headless=true --stacktrace
      env:
        JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"

    - name: Prepare CI Artifact
      run: |
        mkdir -p release
        APK_FOUND=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
        if [ -z "$APK_FOUND" ]; then
          APK_FOUND=$(find . -name "*.apk" -not -path "*/intermediates/*" | head -n 1)
        fi
        
        if [ -n "$APK_FOUND" ]; then
          echo "Copying $APK_FOUND to release/ZeroPay-debug.apk"
          cp "$APK_FOUND" release/ZeroPay-debug.apk
          ls -lh release/
        else
          echo "ERROR: No generated APK found!"
          exit 1
        fi

    - name: Upload Build Artifact to GitHub Actions
      uses: actions/upload-artifact@v4
      with:
        name: ZeroPay-debug-apk
        path: release/ZeroPay-debug.apk
        if-no-files-found: error
