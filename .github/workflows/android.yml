name: Android Build & Release

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Ensure Gradle Wrapper & Permissions
      run: |
        echo "=== Locating and preparing gradlew ==="
        if [ ! -f "./gradlew" ]; then
          echo "gradlew not found in root, searching in subdirectories..."
          SUB_GRADLEW=$(find . -maxdepth 3 -name "gradlew" | head -n 1)
          if [ -n "$SUB_GRADLEW" ]; then
            echo "Found gradlew at $SUB_GRADLEW, copying to root..."
            cp "$SUB_GRADLEW" ./gradlew
          else
            echo "Generating Gradle wrapper..."
            gradle wrapper
          fi
        fi
        
        # Grant executable permissions
        chmod +x ./gradlew
        ls -la ./gradlew
        ./gradlew --version

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Prepare Release Asset
      run: |
        mkdir -p release
        APK_FOUND=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
        if [ -z "$APK_FOUND" ]; then
          APK_FOUND=$(find . -name "*.apk" -not -path "*/intermediates/*" | head -n 1)
        fi
        
        if [ -n "$APK_FOUND" ]; then
          echo "Copying APK from $APK_FOUND to release/ZeroPay-SMS-Forwarder-v1.0.0.apk"
          cp "$APK_FOUND" release/ZeroPay-SMS-Forwarder-v1.0.0.apk
          ls -lh release/ZeroPay-SMS-Forwarder-v1.0.0.apk
        else
          echo "ERROR: No generated APK found!"
          exit 1
        fi

    - name: Upload Build Artifact to GitHub Actions
      uses: actions/upload-artifact@v4
      with:
        name: ZeroPay-SMS-Forwarder-v1.0.0
        path: release/ZeroPay-SMS-Forwarder-v1.0.0.apk
        if-no-files-found: error

    - name: Publish GitHub Release
      if: github.event_name != 'pull_request'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
        name: "ZeroPay SMS Forwarder ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}"
        files: release/ZeroPay-SMS-Forwarder-v1.0.0.apk
        body: |
          ### 🚀 ZeroPay SMS Forwarder ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          Enterprise-grade automated MFS SMS ingestion & real-time webhook client for the ZeroPay gateway ecosystem.

          #### 📥 Download Link:
          - **[Download ZeroPay-SMS-Forwarder-v1.0.0.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.0/ZeroPay-SMS-Forwarder-v1.0.0.apk)**

          #### ⚡ Features & Updates:
          - High priority Telephony SMS BroadcastReceiver
          - Android 13+ Restricted Settings guidance dialog
          - Persistent Foreground Service keep-alive
          - Direct webhook integration for bKash, Nagad, and Rocket
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
