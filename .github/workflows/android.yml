name: Android Build & Release

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build APK & Attach Release
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant Execute Permission to Gradlew
      run: chmod +x gradlew || true

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ZeroPay-SMS-Forwarder-APK
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Create GitHub Release on Tag
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: app/build/outputs/apk/debug/app-debug.apk
        name: ZeroPay SMS Forwarder ${{ github.ref_name }}
        body: |
          ### Zero Pay SMS Forwarder ${{ github.ref_name }}
          Automated MFS SMS Ingestion Client for the Zero Pay SaaS Gateway ecosystem.
          
          **Release Highlights:**
          - Official ZeroPay branding with clean white background (bKash & Nagad MFS design standard)
          - Android 13+ Restricted Settings permission auto-detection
          - Highest priority Telephony SMS BroadcastReceiver
          - Direct integration with `/api/webhooks/sms` endpoint
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
