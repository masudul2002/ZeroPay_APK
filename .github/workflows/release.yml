name: Android Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Ensure Gradle Wrapper & Permissions
      run: |
        echo "=== Locating and preparing gradlew ==="
        if [ ! -f "./gradlew" ]; then
          echo "gradlew not found in root, searching in subdirectories..."
          SUB_GRADLEW=$(find . -maxdepth 3 -name "gradlew" | head -n 1)
          if [ -n "$SUB_GRADLEW" ]; then
            echo "Found gradlew at $SUB_GRADLEW, copying to root..."
            cp "$SUB_GRADLEW" ./gradlew
          else
            echo "Generating Gradle wrapper..."
            gradle wrapper
          fi
        fi
        
        # Grant executable permissions
        chmod +x ./gradlew
        ls -la ./gradlew
        ./gradlew --version

    - name: Generate debug keystore
      run: keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "C=US, O=Android, CN=Android Debug"

    - name: Build Release and Debug APKs
      run: ./gradlew assembleRelease assembleDebug -Djava.awt.headless=true --stacktrace
      env:
        JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"

    - name: Prepare Release Asset
      run: |
        mkdir -p release
        APK_FOUND=$(find app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -n 1)
        if [ -z "$APK_FOUND" ]; then
          APK_FOUND=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
        fi
        
        TAG_NAME="${GITHUB_REF_NAME:-v1.0.2}"
        if [ -n "$APK_FOUND" ]; then
          echo "Copying $APK_FOUND to release/ZeroPay-${TAG_NAME}.apk"
          cp "$APK_FOUND" "release/ZeroPay-${TAG_NAME}.apk"
          cp "$APK_FOUND" "release/ZeroPay-SMS-Forwarder-${TAG_NAME}.apk"
          ls -lh release/
        else
          echo "ERROR: No generated APK found!"
          exit 1
        fi

    - name: Upload Build Artifact to GitHub Actions
      uses: actions/upload-artifact@v4
      with:
        name: ZeroPay-${{ github.ref_name }}
        path: release/*.apk
        if-no-files-found: error

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: "ZeroPay ${{ github.ref_name }}"
        files: |
          release/*.apk
        body: |
          ### 🚀 ZeroPay SMS Forwarder ${{ github.ref_name }}
          Enterprise-grade automated MFS SMS ingestion & real-time webhook client for the ZeroPay gateway ecosystem.

          #### 📥 Direct Download Link:
          - **[Download ZeroPay APK](https://github.com/masudul2002/ZeroPay_APK/releases/download/${{ github.ref_name }}/ZeroPay-${{ github.ref_name }}.apk)**

          #### ⚡ Features & Updates:
          - **QR Auto-Connect & Pairing Sync Ping:** Fully compatible with Next.js web dashboard (`POST /api/v1/webhook`).
          - **Smart Transaction Filtering:** Automatically filters real financial transactions from bKash, Nagad, Rocket, BRACBANK, etc., dropping OTPs and promotional spam.
          - **4-Tab Navigation & Manual Setup:** Complete Home, SMS Log, Filters, and Settings tabs with paste JSON support.
          - **Native Jetpack Compose Data Flow Pipeline:** Circuit and electric particle animation while syncing.
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
