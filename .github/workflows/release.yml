name: Android Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Ensure Gradle Wrapper & Permissions
      run: |
        echo "=== Locating and preparing gradlew ==="
        if [ ! -f "./gradlew" ]; then
          echo "gradlew not found in root, searching in subdirectories..."
          SUB_GRADLEW=$(find . -maxdepth 3 -name "gradlew" | head -n 1)
          if [ -n "$SUB_GRADLEW" ]; then
            echo "Found gradlew at $SUB_GRADLEW, copying to root..."
            cp "$SUB_GRADLEW" ./gradlew
          else
            echo "Generating Gradle wrapper..."
            gradle wrapper
          fi
        fi
        
        # Grant executable permissions
        chmod +x ./gradlew
        ls -la ./gradlew
        ./gradlew --version

    - name: Generate release keystore if missing
      run: |
        if [ ! -f "keystore.jks" ]; then
          echo "Generating production keystore.jks..."
          keytool -genkey -v -keystore keystore.jks -storepass zeropay123 -alias zeropay -keypass zeropay123 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=ZeroPay, OU=Mobile, O=AI Studio, L=Dhaka, ST=Dhaka, C=BD"
        fi
        if [ ! -f "debug.keystore" ]; then
          echo "Generating debug.keystore..."
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "C=US, O=Android, CN=Android Debug"
        fi

    - name: Build Release, Debug APKs and Bundle (AAB)
      run: ./gradlew assembleRelease assembleDebug bundleRelease -Djava.awt.headless=true --stacktrace
      env:
        JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"

    - name: Prepare Release Assets
      run: |
        mkdir -p release
        APK_FOUND=$(find app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -n 1)
        if [ -z "$APK_FOUND" ]; then
          APK_FOUND=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
        fi
        
        AAB_FOUND=$(find app/build/outputs/bundle/release -name "*.aab" 2>/dev/null | head -n 1)
        
        TAG_NAME="${GITHUB_REF_NAME:-v1.20.0}"
        if [ -n "$APK_FOUND" ]; then
          echo "Copying $APK_FOUND to release/ZeroPay-${TAG_NAME}.apk"
          cp "$APK_FOUND" "release/ZeroPay-${TAG_NAME}.apk"
          cp "$APK_FOUND" "release/ZeroPay-SMS-Forwarder-${TAG_NAME}.apk"
          if [ -n "$AAB_FOUND" ]; then
            echo "Copying $AAB_FOUND to release/ZeroPay-${TAG_NAME}.aab"
            cp "$AAB_FOUND" "release/ZeroPay-${TAG_NAME}.aab"
          fi
          ls -lh release/
        else
          echo "ERROR: No generated APK found!"
          exit 1
        fi

    - name: Upload Build Artifact to GitHub Actions
      uses: actions/upload-artifact@v4
      with:
        name: ZeroPay-${{ github.ref_name }}
        path: |
          release/*.apk
          release/*.aab
        if-no-files-found: error

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: "ZeroPay ${{ github.ref_name }}"
        files: |
          release/*.apk
          release/*.aab
        body: |
          ### 🚀 ZeroPay SMS Forwarder ${{ github.ref_name }}
          Enterprise-grade automated MFS & Banking SMS ingestion & real-time webhook pipeline for the ZeroPay gateway ecosystem (`https://www.zero-pay.tech`).

          #### 📥 Direct Download Links:
          - **[Download ZeroPay-v1.20.0.apk](https://github.com/masudul2002/ZeroPay_APK/releases/download/${{ github.ref_name }}/ZeroPay-${{ github.ref_name }}.apk)**
          - **[Download ZeroPay-SMS-Forwarder-v1.20.0.apk](https://github.com/masudul2002/ZeroPay_APK/releases/download/${{ github.ref_name }}/ZeroPay-SMS-Forwarder-${{ github.ref_name }}.apk)**

          #### ⚡ What's New in v1.20.0:
          - **Comprehensive 14+ Gateway & Bank Parsing Engine:** High-precision regex parsers for bKash, Nagad (Bangla QR, Personal, Add Money), Upay (Bangla QR, Personal), BRAC Bank, TallyPay QR, Islami Bank (IBBL ATM, Deposit Slip), Midland Bank, Sonali Bank NPSB, Trust Bank (ATM, Card Received), etc.
          - **Universal Fallback SMS Parser:** Intelligent dynamic parser that extracts Amount, Sender/Account, and generates reliable transaction payloads for unlisted or unexpected bank/MFS receipts without dropping genuine funds.
          - **Deterministic Reference Fallback:** Automatically generates secure, idempotent `REF-<HEX12>` reference tokens for bank credits lacking traditional transaction IDs.
          - **ProGuard / R8 Optimization & Production Signing:** Reduced APK footprint by ~73% (down to ~5MB) with robust keep rules protecting SMS BroadcastReceivers, Room DB, and network dispatchers.
          - **Instant Handshake & Pairing Sync:** Verifies credentials immediately on manual paste and QR code scanning to sync status with the web dashboard.
          - **Zero-Drop Dispatcher:** Intercepted payment SMS are never dropped by sender whitelist restrictions, automatically routing to `https://www.zero-pay.tech/api/v1/webhook`.
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
